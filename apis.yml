aid: next-big-idea-club
name: Next Big Idea Club
description: >-
  Next Big Idea Club is a nonfiction book subscription club and podcast that curates the most
  important new nonfiction, chosen by a selection committee of Malcolm Gladwell, Adam Grant, Susan
  Cain, and Daniel Pink. Members receive curated new nonfiction, an in-app library, courses, and
  author interviews across the web and native iOS/Android apps. The consumer experience is powered
  by a first-party WordPress REST API (the members/v1 namespace) secured with OAuth 2.0 / OpenID
  Connect via the WP OAuth Server, with Stripe integration for subscription billing. This profile
  was seeded as a Bloomberg Beta portfolio lead and enriched from the provider's public /wp-json/
  discovery and /.well-known/ OAuth surface.
